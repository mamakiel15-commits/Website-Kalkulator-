<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Modern</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #252542);
        }

        .calculator {
            background-color: #0f0f1a;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 320px;
        }

        .display {
            width: 100%;
            height: 80px;
            background-color: #1a1a2e;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 2.5rem;
            text-align: right;
            padding: 0 15px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #262647;
            color: #ffffff;
        }

        button:hover {
            background-color: #353564;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Tombol Operator (+, -, *, /) */
        .operator {
            background-color: #ff9f0a;
            color: #ffffff;
        }

        .operator:hover {
            background-color: #cc7f08;
        }

        /* Tombol Fungsi (C, Del) */
        .function {
            background-color: #a5a5a5;
            color: #000000;
        }

        .function:hover {
            background-color: #8e8e8e;
        }

        /* Tombol Sama Dengan (=) */
        .equal {
            background-color: #34c759;
            color: #ffffff;
            grid-column: span 2;
        }

        .equal:hover {
            background-color: #28a148;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="display" id="display" readonly>
        
        <div class="buttons">
            <button class="function" onclick="clearDisplay()">C</button>
            <button class="function" onclick="deleteLast()">Del</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('.')">.</button>

            <button onclick="appendValue('0')">0</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        // Menambahkan angka atau operator ke layar
        function appendValue(value) {
            display.value += value;
        }

        // Membersihkan seluruh layar (Reset)
        function clearDisplay() {
            display.value = '';
        }

        // Menghapus satu karakter terakhir (Backspace)
        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        // Melakukan perhitungan otomatis
        function calculate() {
            try {
                // Menggunakan fungsi eval() untuk menghitung string matematika
                // Jika input kosong, biarkan kosong
                if (display.value !== '') {
                    display.value = eval(display.value);
                }
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>
</body>
              </html>
